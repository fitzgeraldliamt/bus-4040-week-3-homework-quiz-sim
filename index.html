function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const item = questions[index];
  answered = false;
  card.innerHTML =
    '<div class="bar"><div style="width:' + (index / QUIZ_LENGTH * 100) + '%"></div></div>' +
    '<div class="meta"><span>🐮 Question ' + (index + 1) + ' of ' + QUIZ_LENGTH + '</span><span>Herd points: ' + score + '</span></div>' +
    '<h2 id="qtext"></h2><div id="opts"></div>' +
    '<div id="explain" class="box explain hidden"></div>' +
    '<div id="reward" class="box reward hidden"></div>' +
    '<div class="center"><button class="btn hidden" id="next"></button></div>';
  $("qtext").textContent = item.q;
  item.options.forEach((text) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = text;
    b.onclick = () => choose(b, text);
    $("opts").appendChild(b);
  });
}

function choose(btn, text) {
  if (answered) return;
  answered = true;
  const item = questions[index];
  const isRight = text === item.right;
  if (isRight) score++;

  document.querySelectorAll(".opt").forEach((b) => {
    b.disabled = true;
    if (b.textContent === item.right) b.classList.add("correct");
  });
  if (!isRight) btn.classList.add("wrong");

  const ex = $("explain");
  ex.className = "box explain " + (isRight ? "right" : "miss");
  ex.innerHTML = "<h3></h3><p></p>";
  ex.querySelector("h3").textContent = isRight ? "✅ Moo-velous! That's right." : "❌ Not quite - that's a cow-lamity.";
  ex.querySelector("p").textContent = (isRight ? "" : "The right answer: " + item.right + ". ") + item.why;

  const next = $("next");
  next.textContent = index === QUIZ_LENGTH - 1 ? "See my results 🐄" : "Next question ➡️";
  next.onclick = () => { index++; index < QUIZ_LENGTH ? showQuestion() : showResults(); };

  if (isRight) {
    const rw = $("reward");
    rw.innerHTML = "<h3>🥛 Your cow joke reward</h3><p></p>";
    rw.querySelector("p").textContent = jokes[(score - 1) % jokes.length];
    setTimeout(() => { rw.classList.remove("hidden"); next.classList.remove("hidden"); }, 700);
  } else {
    next.classList.remove("hidden");
  }
}

function showResults() {
  let title, cow;
  const pct = score / QUIZ_LENGTH;
  if (pct >= 0.9) { title = "Grand Champion Cow! Outstanding!"; cow = "🏆🐮"; }
  else if (pct >= 0.7) { title = "Prize-winning heifer. Nice work!"; cow = "🐄"; }
  else if (pct >= 0.5) { title = "Still chewing on it. A bit more study will help."; cow = "🐮"; }
  else { title = "Back to the pasture for more grazing on the narratives."; cow = "🌾🐮"; }
  card.innerHTML =
    '<div class="center"><div class="big-cow">' + cow + '</div>' +
    '<h2>Quiz complete!</h2>' +
    '<div class="score">' + score + ' / ' + QUIZ_LENGTH + '</div>' +
    '<p>' + title + '</p>' +
    '<button class="btn" id="again">Round up a new herd 🔄</button></div>';
  $("again").onclick = start;
}

showIntro();
</script>
</body>
</html>
